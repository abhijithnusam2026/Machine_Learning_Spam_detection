name: Sync to Hugging Face Hub

on:
  push:
    # We are tracking this specific branch for the cloud deployment test!
    branches: ["feature/phase-4-cloud-deployment"]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: tanu011235/ml_project
          hf_token: ${{ secrets.HF_TOKEN }}
