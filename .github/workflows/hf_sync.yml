name: Sync to Hugging Face Hub

on:
  workflow_dispatch:
    inputs:
      huggingface_repo_id:
        description: "Target Hugging Face Space repo, for example tanu011235/scam_detection_cpu_q8_staging"
        required: true
        default: "tanu011235/scam_detection_cpu_q8_staging"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ inputs.huggingface_repo_id }}
          hf_token: ${{ secrets.HF_TOKEN }}
