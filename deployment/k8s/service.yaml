apiVersion: v1
kind: Service
metadata:
  name: call-center-serving
  labels:
    app: call-center-intelligence
    component: serving
spec:
  type: ClusterIP
  selector:
    app: call-center-intelligence
    component: serving
  ports:
    - name: http-api
      port: 80
      targetPort: http-api
    - name: vllm
      port: 8001
      targetPort: vllm
