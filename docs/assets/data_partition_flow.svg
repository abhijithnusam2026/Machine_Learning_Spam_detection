<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Data Partition Flow for Unified Scam Detection Pipeline</title>
  <desc id="desc">Diagram showing raw data sources, canonical splitting into train validation test and PTQ calibration, then use by training, quantization, evaluation, and serving selection.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .source { fill: #eef2ff; stroke: #4f46e5; }
      .split { fill: #ecfdf5; stroke: #059669; }
      .train { fill: #fff7ed; stroke: #ea580c; }
      .eval { fill: #fef2f2; stroke: #dc2626; }
      .opt { fill: #f5f3ff; stroke: #7c3aed; }
      .serve { fill: #eff6ff; stroke: #2563eb; }
      .text { font-family: Inter, Arial, sans-serif; font-size: 18px; fill: #0f172a; }
      .small { font-size: 15px; fill: #334155; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .noLeak { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrowRed); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1060"/>
  <text class="text title" x="70" y="60">Data Partition Flow and Leakage Controls</text>
  <text class="text small" x="70" y="92">Unified pipeline: raw data -> deterministic splits -> staged training -> calibrated PTQ -> final evaluation and serving selection</text>

  <rect class="box source" x="70" y="135" width="310" height="150"/>
  <text class="text label" x="95" y="172">Raw Source Data</text>
  <text class="text small" x="95" y="202">Kaggle SMS / Email / Phishing</text>
  <text class="text small" x="95" y="226">Teeconnie non-scam</text>
  <text class="text small" x="95" y="250">Synthetic LLM JSON</text>
  <text class="text small" x="95" y="274">Raw ASR transcripts</text>

  <rect class="box source" x="455" y="135" width="320" height="150"/>
  <text class="text label" x="480" y="172">02_build_datasets.py</text>
  <text class="text small" x="480" y="202">clean and normalize text</text>
  <text class="text small" x="480" y="226">standardize labels and sources</text>
  <text class="text small" x="480" y="250">deduplicate by cleaned text</text>

  <rect class="box source" x="850" y="135" width="330" height="150"/>
  <text class="text label" x="875" y="172">Canonical Dataset</text>
  <text class="text small" x="875" y="202">columns: text, label</text>
  <text class="text small" x="875" y="226">source_domain</text>
  <text class="text small" x="875" y="250">source_dataset</text>

  <path class="arrow" d="M380 210 H455"/>
  <path class="arrow" d="M775 210 H850"/>

  <rect class="box eval" x="70" y="380" width="330" height="145"/>
  <text class="text label" x="95" y="417">global_test.csv</text>
  <text class="text small" x="95" y="447">20% frozen holdout</text>
  <text class="text small" x="95" y="471">stratified by label + domain</text>
  <text class="text small" x="95" y="495">never used for training/calibration</text>

  <rect class="box split" x="475" y="380" width="330" height="145"/>
  <text class="text label" x="500" y="417">Train / Validation Pool</text>
  <text class="text small" x="500" y="447">remaining 80%</text>
  <text class="text small" x="500" y="471">source for train and validation</text>

  <rect class="box split" x="890" y="360" width="290" height="125"/>
  <text class="text label" x="915" y="397">global_val.csv</text>
  <text class="text small" x="915" y="427">training-time validation</text>
  <text class="text small" x="915" y="451">checkpoint/model selection</text>

  <rect class="box train" x="890" y="535" width="290" height="125"/>
  <text class="text label" x="915" y="572">global_train.csv</text>
  <text class="text small" x="915" y="602">model fitting only</text>
  <text class="text small" x="915" y="626">source for PTQ calibration</text>

  <rect class="box opt" x="1265" y="535" width="265" height="125"/>
  <text class="text label" x="1290" y="572">ptq_calibration.csv</text>
  <text class="text small" x="1290" y="602">256 stratified rows</text>
  <text class="text small" x="1290" y="626">sampled from train only</text>

  <path class="arrow" d="M1015 285 C1015 330 235 330 235 380"/>
  <path class="arrow" d="M1015 285 C1015 330 640 330 640 380"/>
  <path class="arrow" d="M805 452 H890"/>
  <path class="arrow" d="M640 525 C640 595 820 597 890 597"/>
  <path class="arrow" d="M1180 597 H1265"/>
  <path class="noLeak" d="M1398 535 C1398 485 1260 455 1180 435"/>
  <path class="noLeak" d="M1398 535 C1398 445 520 452 400 452"/>
  <text class="text small" x="1195" y="498" fill="#dc2626">assert no overlap with val/test</text>

  <rect class="box train" x="70" y="740" width="315" height="145"/>
  <text class="text label" x="95" y="777">03 DistilBERT Baseline</text>
  <text class="text small" x="95" y="807">train: written_text</text>
  <text class="text small" x="95" y="831">exclude synthetic</text>
  <text class="text small" x="95" y="855">validate on global_val filter</text>

  <rect class="box train" x="435" y="740" width="315" height="145"/>
  <text class="text label" x="460" y="777">04 ModernBERT Universal</text>
  <text class="text small" x="460" y="807">train: written_text</text>
  <text class="text small" x="460" y="831">include synthetic</text>
  <text class="text small" x="460" y="855">validate on global_val filter</text>

  <rect class="box train" x="800" y="740" width="315" height="145"/>
  <text class="text label" x="825" y="777">05 ASR Retraining</text>
  <text class="text small" x="825" y="807">train: spoken_asr only</text>
  <text class="text small" x="825" y="831">starts from ModernBERT</text>
  <text class="text small" x="825" y="855">validate on ASR val filter</text>

  <rect class="box opt" x="1180" y="740" width="350" height="145"/>
  <text class="text label" x="1205" y="777">06 Quantization</text>
  <text class="text small" x="1205" y="807">GGUF: weight-only PTQ</text>
  <text class="text small" x="1205" y="831">ONNX: static INT8 calibrated PTQ</text>
  <text class="text small" x="1205" y="855">evaluate on frozen global_test</text>

  <path class="arrow" d="M1035 660 C1035 705 228 705 228 740"/>
  <path class="arrow" d="M1035 660 C1035 705 593 705 593 740"/>
  <path class="arrow" d="M1035 660 C1035 705 958 705 958 740"/>
  <path class="arrow" d="M1115 812 H1180"/>
  <path class="arrow" d="M1398 660 V740"/>
  <path class="arrow" d="M235 525 C235 665 1355 665 1355 740"/>

  <rect class="box eval" x="70" y="945" width="450" height="80"/>
  <text class="text label" x="95" y="980">07 Whisper Quant Benchmark</text>
  <text class="text small" x="95" y="1005">separate audio holdout: data/large_audio_test/manifest.csv</text>

  <rect class="box serve" x="595" y="945" width="430" height="80"/>
  <text class="text label" x="620" y="980">08 E2E Combo Benchmark</text>
  <text class="text small" x="620" y="1005">audio holdout + classifier/ASR variants</text>

  <rect class="box serve" x="1100" y="945" width="430" height="80"/>
  <text class="text label" x="1125" y="980">09 Best Pipeline Selection</text>
  <text class="text small" x="1125" y="1005">rank by accuracy, latency, and model size</text>

  <path class="arrow" d="M1355 885 C1355 925 810 900 810 945"/>
  <path class="arrow" d="M520 985 H595"/>
  <path class="arrow" d="M1025 985 H1100"/>
</svg>
