[project]
name = "distilbert-scam-classifier"
version = "0.1.0"
description = "End-to-end ML system for call transcript summarization, intent classification, optimization, serving, deployment, and monitoring."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Tanishq" }
]
dependencies = [
  "boto3>=1.34.0",
  "datasets==2.20.0",
  "dagshub==0.4.0",
  "fastapi==0.111.1",
  "httpx>=0.28.1",
  "lightgbm>=4.3.0",
  "mlflow==2.15.1",
  "huggingface_hub==0.24.5",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "pydantic>=2.10.4",
  "python-dotenv==1.0.1",
  "scikit-learn==1.5.1",
  "setuptools==70.3.0",
  "torch==2.4.0",
  "transformers==4.48.3",
  "peft==0.12.0",
  "uvicorn>=0.34.0",
  "wrapt>=2.3.0",
  "accelerate>=1.1.0",
  "seaborn>=0.13.2",
  "youtube-transcript-api>=0.6.3",
  "gguf>=0.10.0",
  "llama-cpp-python>=0.2.79",
  "tiktoken>=0.7.0",
  "edge-tts>=7.2.8",
  "python-multipart==0.0.9",
  "sse-starlette==2.1.3",
  "pywhispercpp==1.2.0",
]

[project.optional-dependencies]
dev = [
  "black==24.10.0",
  "ipykernel==6.29.5",
  "isort==5.13.2",
  "jupyterlab==4.3.4",
  "mypy==1.14.1",
  "pre-commit==4.0.1",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "ruff==0.8.4"
]
gpu = [
  "auto-gptq==0.7.1",
  "onnxruntime-gpu>=1.19.0,<2.0.0"
]
onnx = [
  "onnx==1.16.1",
  "onnxruntime==1.19.2",
  "protobuf==4.25.4"
]



[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
