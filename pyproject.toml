[project]
name = "call-center-intelligence-system"
version = "0.1.0"
description = "End-to-end ML system for call transcript summarization, intent classification, optimization, serving, deployment, and monitoring."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
authors = [
  { name = "Tanishq" }
]
dependencies = [
  "accelerate==1.2.1",
  "bitsandbytes==0.45.0",
  "datasets==3.2.0",
  "evaluate==0.4.3",
  "fastapi==0.115.6",
  "grafana-api==1.0.3",
  "httpx==0.28.1",
  "numpy==1.26.4",
  "onnx==1.17.0",
  "onnxruntime==1.20.1",
  "optimum==1.23.3",
  "pandas==2.2.3",
  "peft==0.14.0",
  "prometheus-client==0.21.1",
  "pydantic==2.10.4",
  "python-dotenv==1.0.1",
  "rouge-score==0.1.2",
  "scikit-learn==1.6.0",
  "sentence-transformers==3.3.1",
  "torch==2.5.1",
  "transformers==4.47.1",
  "tqdm==4.67.1",
  "trl==0.13.0",
  "uvicorn==0.34.0",
  "vllm==0.6.6.post1",
  "wandb==0.19.1"
]

[project.optional-dependencies]
dev = [
  "black==24.10.0",
  "ipykernel==6.29.5",
  "isort==5.13.2",
  "jupyterlab==4.3.4",
  "mypy==1.14.1",
  "pre-commit==4.0.1",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "ruff==0.8.4"
]
gpu = [
  "auto-gptq==0.7.1",
  "onnxruntime-gpu==1.20.1"
]

[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
